<!DOCTYPE html>




<html>
	

    <head>
		<meta charset="utf-8">
		<title>blog do du</title>
		<script type="text/javascript">
			// ......... truque de redirecionamento para SPA no GitHub Pages .........
			// Este script pega o caminho que deu 404 e o transforma em um parâmetro de busca.
			// Assim, o index.html carrega e o roteador consegue ler para onde o usuário queria ir.
      		var pathSegmentsToKeep = 0;
			var l = window.location;
			l.replace
            (
				l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
			    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
			    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
			    (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
			    l.hash
		    );
    	</script>
    </head>


    <body>
    </body>



    
</html>
